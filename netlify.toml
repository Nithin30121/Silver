# SILVORA: Netlify deployment settings.
# The site is a static build; Supabase provides authentication and the database,
# so no server of ours needs to run. Security headers live in public/_headers.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node.js 20.19+ or 22.12+.
  NODE_VERSION = "22"

# Single-page app: any path that is not a real file is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
