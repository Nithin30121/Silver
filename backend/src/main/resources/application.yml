spring:
  application:
    name: silvesto-api
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing Supabase schema
    schemas: public
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URL}
          # Spring trusts only RS256 unless told otherwise, but Supabase signs access tokens with
          # ES256 (an ECC P-256 key) by default, so every login was rejected with 401. Both
          # asymmetric algorithms are accepted so rotating the Supabase signing key between ECC and
          # RSA keeps working; tokens must still verify against the keys published at the JWKS URL.
          jws-algorithms: ${SUPABASE_JWT_ALGORITHMS:ES256,RS256}
  servlet:
    multipart:
      # Matches the 5 MB product-image rule and the Storage bucket limit (Spring's default is 1 MB).
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # Hosts such as Render tell the app which port to use through PORT.
  port: ${SERVER_PORT:${PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

app:
  admin:
    # Server-only, one-time bootstrap. A matching profile is promoted only if no admin exists.
    initial-email: ${APP_INITIAL_ADMIN_EMAIL:}
  cors:
    # Both loopback spellings are useful during local development; production origins should be
    # supplied explicitly through APP_CORS_ALLOWED_ORIGINS (comma separated).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  storage:
    product-images:
      bucket: ${SUPABASE_PRODUCT_IMAGE_BUCKET:product-images}
  stock:
    # A sale or stock edit that takes a piece down to this many emails the shop (once email is set up),
    # and again when it sells out. The dashboard's low-stock list uses the same number.
    low-threshold: ${APP_LOW_STOCK_THRESHOLD:3}
  reports:
    # "This week" and "this month" on the dashboard, and times in spreadsheet downloads, use this zone.
    time-zone: ${APP_REPORTS_TIME_ZONE:Asia/Kolkata}
  razorpay:
    # Online payments stay off until RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET are both set. The key secret
    # and webhook secret are server-only secrets like the database password. See docs/razorpay-setup.md.
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    api-url: ${RAZORPAY_API_URL:https://api.razorpay.com}
    # An online order that isn't paid in this time is cancelled and its pieces go back on sale.
    pay-within: ${APP_PAYMENT_WINDOW:PT30M}
    check-every: ${APP_PAYMENT_CHECK_EVERY:PT5M}
  mail:
    # Customer order emails stay off until SMTP_HOST and APP_MAIL_FROM are both set. Any SMTP
    # provider works; SMTP_PASSWORD is a server-only secret like the database password.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${APP_MAIL_FROM:}
    shop-name: ${APP_SHOP_NAME:SILVORA}
    # Optional link at the bottom of each email, for example the storefront address.
    shop-url: ${APP_SHOP_URL:}
    # Where contact form messages are forwarded. Defaults to the from address.
    shop-inbox: ${APP_SHOP_INBOX:}
