spring:
  application:
    name: silvesto-api
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Existing Supabase schema
    schemas: public
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URL}
          # Spring trusts only RS256 unless told otherwise, but Supabase signs access tokens with
          # ES256 (an ECC P-256 key) by default, so every login was rejected with 401. Both
          # asymmetric algorithms are accepted so rotating the Supabase signing key between ECC and
          # RSA keeps working; tokens must still verify against the keys published at the JWKS URL.
          jws-algorithms: ${SUPABASE_JWT_ALGORITHMS:ES256,RS256}
  servlet:
    multipart:
      # Matches the 5 MB product-image rule and the Storage bucket limit (Spring's default is 1 MB).
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # Hosts such as Render tell the app which port to use through PORT.
  port: ${SERVER_PORT:${PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

app:
  admin:
    # Server-only, one-time bootstrap. A matching profile is promoted only if no admin exists.
    initial-email: ${APP_INITIAL_ADMIN_EMAIL:}
  cors:
    # Both loopback spellings are useful during local development; production origins should be
    # supplied explicitly through APP_CORS_ALLOWED_ORIGINS (comma separated).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  storage:
    product-images:
      bucket: ${SUPABASE_PRODUCT_IMAGE_BUCKET:product-images}
